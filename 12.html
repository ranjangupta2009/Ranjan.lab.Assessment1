<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            border: 2px solid lightgreen;
            padding: 20px 40px;
            width: 880px;
        }
    </style>
</head>
<body>
    <div class="box">
    <table border="1" cellpadding="10" cellspacing="0">
    <caption>Student Marks</caption>

    <thead>
        <tr>
            <th>Roll</th>
            <th>Name</th>
            <th>Marks</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>1</td>
            <td>Aman</td>
            <td>85</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Riya</td>
            <td>92</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td colspan="2">Average</td>
            <td>88.5</td>
        </tr>
    </tfoot>
    
    </table>
    </div>
</body>
</html>
