<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            border: 2px solid lightgreen;
            padding: 20px 40px;
            width: 880px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h3>Image</h3>
        <img src="college.jpg" alt="College campus" width="150" height="140">
        <h3>Video</h3>
        <video width ="200" height="50" controls>
        <source src="video.mp4" type="video/mp4">
        </video>
        <h3>Audio</h3>
        <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        </audio>
        <h3>YouTube</h3>
        <iframe width="320" height="180" src="https://www.youtube.com/embed/VIDEO_ID" allowfullscreen>
        </iframe>
    </div>
</body>
</html>
